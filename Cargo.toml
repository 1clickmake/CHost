[package]
name = "chost"
version = "0.1.21"
edition = "2021"
description = "CHost - Lightweight Korean Modern Web Server Management Panel in Rust"

[[bin]]
name = "chost"
path = "src/main.rs"

[[bin]]
name = "chost-portal"
path = "src/portal.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
rand = "0.8"
sysinfo = "0.32"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
